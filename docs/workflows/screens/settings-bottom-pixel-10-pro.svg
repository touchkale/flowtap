xt><g transform="translate(343 773) scale(0.8333333333333334)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4l8 8-8 8"/></g><rect x="20" y="833" width="360" height="76" rx="18" fill="#FFFFFF" stroke="#DCE3DC"/><rect x="34" y="851" width="36" height="36" rx="12" fill="#E4EDE3" stroke="none"/><g transform="translate(41 858) scale(0.9166666666666666)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10h12v11H6Z M8 10V7a4 4 0 0 1 8 0v3"/></g><text x="82" y="863" font-size="16" font-weight="600" text-anchor="start" fill="#192D28">Uninstall protection</text><text x="82" y="885" font-size="13" font-weight="400" text-anchor="start" fill="#596A63">Off · Optional protection</text><g transform="translate(343 859) scale(0.8333333333333334)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4l8 8-8 8"/></g><text x="20" y="944" font-size="13" font-weight="650" text-anchor="start" fill="#596A63">BEHAVIOR</text><rect x="20" y="963" width="360" height="76" rx="18" fill="#FFFFFF" stroke="#DCE3DC"/><rect x="34" y="981" width="36" height="36" rx="12" fill="#E4EDE3" stroke="none"/><g transform="translate(41 988) scale(0.9166666666666666)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15A9 9 0 0 1 9 3a9 9 0 1 0 11 12"/></g><text x="82" y="993" font-size="16" font-weight="600" text-anchor="start" fill="#192D28">Use Do Not Disturb</text><text x="82" y="1015" font-size="13" font-weight="400" text-anchor="start" fill="#596A63">Only for modes using DND</text><rect x="331" y="986" width="35" height="22" rx="11" fill="#245C48" stroke="none"/><circle cx="354" cy="997" r="8" fill="#FFFFFF" stroke="none" stroke-width="1"/><rect x="20" y="1049" width="360" height="107" rx="18" fill="#FFFFFF" stroke="#DCE3DC"/><rect x="34" y="1067" width="36" height="36" rx="12" fi