ens Android’s confirmation screen</text><g transform="translate(343 1514) scale(0.8333333333333334)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4l8 8-8 8"/></g></g></g><rect x="0" y="792.5" width="400" height="100" rx="0" fill="#FFFFFF" stroke="none"/><rect x="0" y="792.5" width="400" height="1" rx="0" fill="#DCE3DC" stroke="none"/><g transform="translate(29.0 806.5) scale(0.9166666666666666)" fill="none" stroke="#596A63" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3 21 11 M5 10v11h5v-7h4v7h5V10"/></g><text x="40.0" y="853.5" font-size="11" font-weight="400" text-anchor="middle" fill="#596A63">Home</text><g transform="translate(109.0 806.5) scale(0.9166666666666666)" fill="none" stroke="#596A63" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11a9 9 0 1 1 2 7 M3 4v7h7 M12 7v6l4 2"/></g><text x="120.0" y="853.5" font-size="11" font-weight="400" text-anchor="middle" fill="#596A63">History</text><g transform="translate(189.0 806.5) scale(0.9166666666666666)" fill="none" stroke="#596A63" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20C1 9 8 3 21 3c0 13-7 18-16 17Zm0 0L16 8"/></g><text x="200.0" y="853.5" font-size="11" font-weight="400" text-anchor="middle" fill="#596A63">Tags</text><g transform="translate(269.0 806.5) scale(0.9166666666666666)" fill="none" stroke="#596A63" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16 M4 12h16 M4 18h16 M8 3v6 M16 9v6 M10 15v6"/></g><text x="280.0" y="853.5" font-size="11" font-weight="400" text-anchor="middle" fill="#596A63">Modes</text><rect x="333.0" y="802.5" width="54" height="30" rx="15" fill="#E4EDE3" stroke="none"/><g transform="translate(349.0 806.5) scale(0.9166666666666666)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l1 4 4 2v6l-4 2-1 4H9l-1-4-4-2V9l4-2Z M15 1