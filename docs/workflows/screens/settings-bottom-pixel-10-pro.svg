<svg xmlns="http://www.w3.org/2000/svg" width="400" height="892.5" viewBox="0 0 400 892.5" role="img" aria-labelledby="title desc"><title id="title">03 · Behavior / end</title><desc id="desc">One scrolling page · readiness first · preferences grouped by purpose; static vector design proposal.</desc><g font-family="Arial, Helvetica, sans-serif"><defs><clipPath id="phone-outline"><rect width="400" height="892.5" rx="30"/></clipPath></defs><g clip-path="url(#phone-outline)"><rect x="0" y="0" width="400" height="892.5" rx="30" fill="#F5F4EE" stroke="none"/><text x="25" y="29" font-size="13" font-weight="600" text-anchor="start" fill="#192D28">9:41</text><circle cx="200.0" cy="23" r="5" fill="#17211D" stroke="none" stroke-width="1"/><rect x="318" y="26" width="3" height="4" rx="1" fill="#192D28" stroke="none"/><rect x="323" y="23" width="3" height="7" rx="1" fill="#192D28" stroke="none"/><rect x="328" y="20" width="3" height="10" rx="1" fill="#192D28" stroke="none"/><rect x="333" y="17" width="3" height="13" rx="1" fill="#192D28" stroke="none"/><rect x="349" y="17" width="25" height="12" rx="3" fill="none" stroke="#192D28"/><rect x="352" y="20" width="18" height="6" rx="1" fill="#192D28" stroke="none"/><rect x="376" y="21" width="2" height="4" rx="1" fill="#192D28" stroke="none"/><text x="20" y="87" font-size="28" font-weight="650" text-anchor="start" fill="#192D28">Settings</text><text x="20" y="116" font-size="14" font-weight="400" text-anchor="start" fill="#596A63">Make FlowTap work for you.</text><defs><clipPath id="settings-bottom-clip"><rect x="0" y="146" width="400" height="636.5"/></clipPath></defs><g clip-path="url(#settings-bottom-clip)"><g transform="translate(0 -791.5)"><rect x="20" y="0" width="360" height="68" rx="16" fill="#E4EDE3" stroke="none"/><text x="36" y="28" font-size="15" font-weight="650" text-anchor="start" fill="#245C48">Ready to protect your focus</text><text x="36" y="51" font-size="13" font-weight="400" text-anchor="start" fill="#596A63">All required permissions are enabled.</text><text x="20" y="107" font-size="13" font-weight="650" text-anchor="start" fill="#596A63">BLOCKING METHOD</text><rect x="20" y="126" width="360" height="76" rx="18" fill="#E4EDE3" stroke="#245C48"/><rect x="34" y="144" width="36" height="36" rx="12" fill="#E4EDE3" stroke="none"/><g transform="translate(41 151) scale(0.9166666666666666)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6q1 7 9 10 8-3 9-10V6Z M8 12l3 3 5-6"/></g><text x="82" y="156" font-size="16" font-weight="600" text-anchor="start" fill="#192D28">Full power</text><text x="82" y="178" font-size="13" font-weight="400" text-anchor="start" fill="#596A63">Instant blocking · Recommended</text><g transform="translate(343 152) scale(0.8333333333333334)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 6"/></g><rect x="20" y="212" width="360" height="88" rx="18" fill="#FFFFFF" stroke="#DCE3DC"/><rect x="34" y="230" width="36" height="36" rx="12" fill="#E4EDE3" stroke="none"/><g transform="translate(41 237) scale(0.9166666666666666)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2h10v20H7Z M10 18h4"/></g><text x="82" y="242" font-size="16" font-weight="600" text-anchor="start" fill="#192D28">Compatibility</text><text x="82" y="264" font-size="13" font-weight="400" text-anchor="start" fill="#596A63">About 2s delay · Easier on banking</text><text x="82" y="283" font-size="13" font-weight="400" text-anchor="start" fill="#596A63">apps</text><g transform="translate(343 238) scale(0.8333333333333334)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4l8 8-8 8"/></g><text x="20" y="324" font-size="14" font-weight="400" text-anchor="start" fill="#596A63">Some banking apps may reject accessibility</text><text x="20" y="345" font-size="14" font-weight="400" text-anchor="start" fill="#596A63">access. Try Compatibility if that happens.</text><text x="20" y="384" font-size="13" font-weight="650" text-anchor="start" fill="#596A63">PERMISSIONS &amp; PROTECTION</text><rect x="20" y="403" width="360" height="76" rx="18" fill="#FFFFFF" stroke="#DCE3DC"/><rect x="34" y="421" width="36" height="36" rx="12" fill="#E4EDE3" stroke="none"/><g transform="translate(41 428) scale(0.9166666666666666)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6q1 7 9 10 8-3 9-10V6Z M8 12l3 3 5-6"/></g><text x="82" y="433" font-size="16" font-weight="600" text-anchor="start" fill="#192D28">App blocking</text><text x="82" y="455" font-size="13" font-weight="400" text-anchor="start" fill="#596A63">Granted · Accessibility enabled</text><g transform="translate(343 429) scale(0.8333333333333334)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4l8 8-8 8"/></g><rect x="20" y="489" width="360" height="76" rx="18" fill="#FFFFFF" stroke="#DCE3DC"/><rect x="34" y="507" width="36" height="36" rx="12" fill="#E4EDE3" stroke="none"/><g transform="translate(41 514) scale(0.9166666666666666)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2h10v20H7Z M10 18h4"/></g><text x="82" y="519" font-size="16" font-weight="600" text-anchor="start" fill="#192D28">Usage access</text><text x="82" y="541" font-size="13" font-weight="400" text-anchor="start" fill="#596A63">Granted · Used by Compatibility</text><g transform="translate(343 515) scale(0.8333333333333334)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4l8 8-8 8"/></g><rect x="20" y="575" width="360" height="76" rx="18" fill="#FFFFFF" stroke="#DCE3DC"/><rect x="34" y="593" width="36" height="36" rx="12" fill="#E4EDE3" stroke="none"/><g transform="tra