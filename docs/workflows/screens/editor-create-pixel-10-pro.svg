chor="middle" fill="#FFFFFF">Block selected</text><rect x="204.0" y="333" width="176.0" height="48" rx="14" fill="#FFFFFF" stroke="#DCE3DC"/><text x="292.0" y="363" font-size="14" font-weight="600" text-anchor="middle" fill="#596A63">Allow selected</text><rect x="20" y="395" width="360" height="76" rx="18" fill="#FFFFFF" stroke="#DCE3DC"/><rect x="34" y="413" width="36" height="36" rx="12" fill="#E4EDE3" stroke="none"/><g transform="translate(41 420) scale(0.9166666666666666)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2h10v20H7Z M10 18h4"/></g><text x="82" y="425" font-size="16" font-weight="600" text-anchor="start" fill="#192D28">Selected apps</text><text x="82" y="447" font-size="13" font-weight="400" text-anchor="start" fill="#596A63">No apps selected</text><g transform="translate(343 421) scale(0.8333333333333334)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4l8 8-8 8"/></g><text x="20" y="495" font-size="14" font-weight="400" text-anchor="start" fill="#596A63">Choose apps to block during this mode.</text><text x="20" y="534" font-size="13" font-weight="650" text-anchor="start" fill="#596A63">SESSION RULES</text><rect x="20" y="553" width="360" height="88" rx="18" fill="#FFFFFF" stroke="#DCE3DC"/><rect x="34" y="571" width="36" height="36" rx="12" fill="#E4EDE3" stroke="none"/><g transform="translate(41 578) scale(0.9166666666666666)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10h12v11H6Z M8 10V7a4 4 0 0 1 8 0v3"/></g><text x="82" y="583" font-size="16" font-weight="600" text-anchor="start" fill="#192D28">Strict mode</text><text x="82" y="605" font-size="13" font-weight="400" text-anchor="start" fill="#596A63">End with the starting tag. Emergency</text><text x="82" y="624" font-size="13" font-weight="400" text-anchor="start" fill="#596A63">hold stays available.</text><rect 