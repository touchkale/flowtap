<svg xmlns="http://www.w3.org/2000/svg" width="400" height="892.5" viewBox="0 0 400 892.5" role="img" aria-labelledby="title desc"><title id="title">02 · Permissions</title><desc id="desc">Pair a tag → enable protection → choose distractions; static vector design proposal.</desc><g font-family="Arial, Helvetica, sans-serif"><defs><clipPath id="phone-outline"><rect width="400" height="892.5" rx="30"/></clipPath></defs><g clip-path="url(#phone-outline)"><rect x="0" y="0" width="400" height="892.5" rx="30" fill="#F5F4EE" stroke="none"/><text x="25" y="29" font-size="13" font-weight="600" text-anchor="start" fill="#192D28">9:41</text><circle cx="200.0" cy="23" r="5" fill="#17211D" stroke="none" stroke-width="1"/><rect x="318" y="26" width="3" height="4" rx="1" fill="#192D28" stroke="none"/><rect x="323" y="23" width="3" height="7" rx="1" fill="#192D28" stroke="none"/><rect x="328" y="20" width="3" height="10" rx="1" fill="#192D28" stroke="none"/><rect x="333" y="17" width="3" height="13" rx="1" fill="#192D28" stroke="none"/><rect x="349" y="17" width="25" height="12" rx="3" fill="none" stroke="#192D28"/><rect x="352" y="20" width="18" height="6" rx="1" fill="#192D28" stroke="none"/><rect x="376" y="21" width="2" height="4" rx="1" fill="#192D28" stroke="none"/><text x="20" y="87" font-size="28" font-weight="650" text-anchor="start" fill="#192D28">Set up your focus</text><text x="20" y="116" font-size="14" font-weight="400" text-anchor="start" fill="#596A63">Step 2 of 3</text><rect x="20.0" y="136" width="116.0" height="4" rx="2" fill="#245C48" stroke="none"/><rect x="140.0" y="136" width="116.0" height="4" rx="2" fill="#245C48" stroke="none"/><rect x="260.0" y="136" width="116.0" height="4" rx="2" fill="#DCE3DC" stroke="none"/><defs><clipPath id="onboard2-clip"><rect x="0" y="164" width="400" height="628.5"/></clipPath></defs><g clip-path="url(#onboard2-clip)"><g transform="translate(0 164)"><rect x="20" y="0" width="360" height="88" rx="16" fill="#E4EDE3" stroke="none"/><text x="36" y="28" font-size="15" font-weight="650" text-anchor="start" fill="#245C48">You’re in control</text><text x="36" y="51" font-size="13" font-weight="400" text-anchor="start" fill="#596A63">Each permission opens Android settings.</text><text x="36" y="71" font-size="13" font-weight="400" text-anchor="start" fill="#596A63">FlowTap does not read your content.</text><rect x="20" y="102" width="360" height="88" rx="18" fill="#E4EDE3" stroke="#245C48"/><rect x="34" y="120" width="36" height="36" rx="12" fill="#E4EDE3" stroke="none"/><g transform="translate(41 127) scale(0.9166666666666666)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6q1 7 9 10 8-3 9-10V6Z M8 12l3 3 5-6"/></g><text x="82" y="132" font-size="16" font-weight="600" text-anchor="start" fill="#192D28">App blocking</text><text x="82" y="154" font-size="13" font-weight="400" text-anchor="start" fill="#596A63">Required · Return from distracting</text><text x="82" y="173" font-size="13" font-weight="400" text-anchor="start" fill="#596A63">apps</text><g transform="translate(343 128) scale(0.8333333333333334)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 6"/></g><rect x="20" y="200" width="360" height="76" rx="18" fill="#FFFFFF" stroke="#DCE3DC"/><rect x="34" y="218" width="36" height="36" rx="12" fill="#E4EDE3" stroke="none"/><g transform="translate(41 225) scale(0.9166666666666666)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V4h4 M16 4h4v4 M20 16v4h-4 M8 20H4v-4 M9 8v8 M13 6q7 6 0 12"/></g><text x="82" y="230" font-size="16" font-weight="600" text-anchor="start" fill="#192D28">NFC scanning</text><text x="82" y="252" font-size="13" font-weight="400" text-anchor="start" fill="#596A63">Required for tag shortcuts</text><g transform="translate(343 226) scale(0.8333333333333334)" fill="none" stroke="#245C