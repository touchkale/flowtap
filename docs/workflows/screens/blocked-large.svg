<svg xmlns="http://www.w3.org/2000/svg" width="440" height="956" viewBox="0 0 440 956" role="img" aria-labelledby="title desc"><title id="title">03 · Blocked app</title><desc id="desc">A useful interruption with a visible emergency route; static vector design proposal.</desc><g font-family="Arial, Helvetica, sans-serif"><defs><clipPath id="phone-outline"><rect width="440" height="956" rx="30"/></clipPath></defs><g clip-path="url(#phone-outline)"><rect x="0" y="0" width="440" height="956" rx="30" fill="#F5F4EE" stroke="none"/><text x="25" y="29" font-size="13" font-weight="600" text-anchor="start" fill="#192D28">9:41</text><circle cx="220.0" cy="23" r="5" fill="#17211D" stroke="none" stroke-width="1"/><rect x="358" y="26" width="3" height="4" rx="1" fill="#192D28" stroke="none"/><rect x="363" y="23" width="3" height="7" rx="1" fill="#192D28" stroke="none"/><rect x="368" y="20" width="3" height="10" rx="1" fill="#192D28" stroke="none"/><rect x="373" y="17" width="3" height="13" rx="1" fill="#192D28" stroke="none"/><rect x="389" y="17" width="25" height="12" rx="3" fill="none" stroke="#192D28"/><rect x="392" y="20" width="18" height="6" rx="1" fill="#192D28" stroke="none"/><rect x="416" y="21" width="2" height="4" rx="1" fill="#192D28" stroke="none"/><text x="20" y="87" font-size="28" font-weight="650" text-anchor="start" fill="#192D28">FlowTap</text><text x="20" y="116" font-size="14" font-weight="400" text-anchor="start" fill="#596A63">Deep Work is protecting this moment.</text><defs><clipPath id="blocked-clip"><rect x="0" y="146" width="440" height="710"/></clipPath></defs><g clip-path="url(#blocked-clip)"><g transform="translate(0 146)"><circle cx="220.0" cy="105" r="96" fill="#E4EDE3" stroke="#DCE3DC" stroke-width="1"/><circle cx="220.0" cy="105" r="73" fill="none" stroke="#DCE3DC" stroke-width="1"/><circle cx="220.0" cy="105" r="50" fill="none" stroke="#DCE3DC" stroke-width="1"/><rect x="191.0" y="63" width="58" height="84" rx="14" fill="#FFFFFF" stroke="#245C48"/><g transform="translate(202.0 85) scale(1.5)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20C1 9 8 3 21 3c0 13-7 18-16 17Zm0 0L16 8"/></g><text x="20" y="253" font-size="29" font-weight="600" text-anchor="start" fill="#192D28">Let YouTube wait.</text><text x="20" y="279" font-size="14" font-weight="400" text-anchor="start" fill="#596A63">You chose this time for Deep Work. Your next small</text><text x="20" y="300" font-size="14" font-weight="400" text-anchor="start" fill="#596A63">step is still there.</text><rect x="20" y="314" width="400" height="68" rx="16" fill="#E4EDE3" stroke="none"/><text x="36" y="342" font-size="15" font-weight="650" text-anchor="start" fill="#245C48">24 minutes of focus</text><text x="36" y="365" font-size="13" font-weight="400" text-anchor="start" fill="#596A63">YouTube is blocked until this session ends.</text><rect x="20" y="396" width="400" height="76" rx="18" fill="#FFFFFF" stroke="#DCE3DC"/><rect x="34" y="414" width="36" height="36" rx="12" fill="#E4EDE3" stroke="none"/><g transform="translate(41 421) scale(0.9166666666666666)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h8l10 10-8 8L3 11Z M7 7h.01"/></g><text x="82" y="426" font-size="16" font-weight="600" text-anchor="start" fill="#192D28">End with your Desk tag</text><text x="82" y="448" font-size="13" font-weight="400" text-anchor="start" fill="#596A63">Strict mode · Use the starting tag</text><rect x="20" y="482" width="400" height="76" rx="18" fill="#FFFFFF" stroke="#DCE3DC"/><rect x="34" y="500" width="36" height="36" rx="12" fill="#E4EDE3" stroke="none"/><g transform="translate(41 507) scale(0.9166666666666666)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10h12v11H6Z M8 10V7a4 4 0 0 1 8 0v3"/></g><text x="82" y="512" font-size="16" font-weight="600" text-anchor="start" fill="#192D28">Need to end urgently?</text><text x="82" y="534" font-size="13" font-weight="400" text-anchor="start" fill="#596A63">Press and hold for emergency access</text><g transform="translate(383 508) scale(0.8333333333333334)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4l8 8-8 8"/></g></g></g><rect x="0" y="856" width="440" height="100" rx="0" fill="#F5F4EE" stroke="none"/><rect x="20" y="866" width="400" height="54" rx="17" fill="#245C48" stroke="none"/><text x="220.0" y="900" font-size="16" font-weight="650" text-anchor="middle" fill="#FFFFFF">Back to focus</text><rect x="167.0" y="943" width="106" height="4" rx="2" fill="#192D28" stroke="none"/></g></g></svg>
