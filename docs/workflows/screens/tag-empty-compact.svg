<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800" role="img" aria-labelledby="title desc"><title id="title">01 · First tag</title><desc id="desc">Empty state → pairing → success, with a clear retry path; static vector design proposal.</desc><g font-family="Arial, Helvetica, sans-serif"><defs><clipPath id="phone-outline"><rect width="360" height="800" rx="30"/></clipPath></defs><g clip-path="url(#phone-outline)"><rect x="0" y="0" width="360" height="800" rx="30" fill="#F5F4EE" stroke="none"/><text x="25" y="29" font-size="13" font-weight="600" text-anchor="start" fill="#192D28">9:41</text><circle cx="180.0" cy="23" r="5" fill="#17211D" stroke="none" stroke-width="1"/><rect x="278" y="26" width="3" height="4" rx="1" fill="#192D28" stroke="none"/><rect x="283" y="23" width="3" height="7" rx="1" fill="#192D28" stroke="none"/><rect x="288" y="20" width="3" height="10" rx="1" fill="#192D28" stroke="none"/><rect x="293" y="17" width="3" height="13" rx="1" fill="#192D28" stroke="none"/><rect x="309" y="17" width="25" height="12" rx="3" fill="none" stroke="#192D28"/><rect x="312" y="20" width="18" height="6" rx="1" fill="#192D28" stroke="none"/><rect x="336" y="21" width="2" height="4" rx="1" fill="#192D28" stroke="none"/><text x="20" y="87" font-size="28" font-weight="650" text-anchor="start" fill="#192D28">Your tags</text><text x="20" y="116" font-size="14" font-weight="400" text-anchor="start" fill="#596A63">A physical shortcut to being present.</text><defs><clipPath id="tag-empty-clip"><rect x="0" y="146" width="360" height="480"/></clipPath></defs><g clip-path="url(#tag-empty-clip)"><g transform="translate(0 146)"><circle cx="180.0" cy="105" r="96" fill="#E4EDE3" stroke="#DCE3DC" stroke-width="1"/><circle cx="180.0" cy="105" r="73" fill="none" stroke="#DCE3DC" stroke-width="1"/><circle cx="180.0" cy="105" r="50" fill="none" stroke="#DCE3DC" stroke-width="1"/><rect x="151.0" y="63" width="58" height="84" rx="14" fill="#FFFFFF" stroke=