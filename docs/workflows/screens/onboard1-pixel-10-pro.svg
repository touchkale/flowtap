<svg xmlns="http://www.w3.org/2000/svg" width="400" height="892.5" viewBox="0 0 400 892.5" role="img" aria-labelledby="title desc"><title id="title">01 · Pair or skip</title><desc id="desc">Pair a tag → enable protection → choose distractions; static vector design proposal.</desc><g font-family="Arial, Helvetica, sans-serif"><defs><clipPath id="phone-outline"><rect width="400" height="892.5" rx="30"/></clipPath></defs><g clip-path="url(#phone-outline)"><rect x="0" y="0" width="400" height="892.5" rx="30" fill="#F5F4EE" stroke="none"/><text x="25" y="29" font-size="13" font-weight="600" text-anchor="start" fill="#192D28">9:41</text><circle cx="200.0" cy="23" r="5" fill="#17211D" stroke="none" stroke-width="1"/><rect x="318" y="26" width="3" height="4" rx="1" fill="#192D28" stroke="none"/><rect x="323" y="23" width="3" height="7" rx="1" fill="#192D28" stroke="none"/><rect x="328" y="20" width="3" height="10" rx="1" fill="#192D28" stroke="none"/><rect x="333" y="17" width="3" height="13" rx="1" fill="#192D28" stroke="none"/><rect x="349" y="17" width="25" height="12" rx="3" fill="none" stroke="#192D28"/><rect x="352" y="20" width="18" height="6" rx="1" fill="#192D28" stroke="none"/><rect x="376" y="21" width="2" height="4" rx="1" fill="#192D28" stroke="none"/><text x="20" y="87" font-size="24" font-weight="650" text-anchor="start" fill="#192D28">Pair your first tag</text><text x="20" y="116" font-size="14" font-weight="400" text-anchor="start" fill="#596A63">Step 1 of 3</text><rect x="20.0" y="136" width="116.0" height="4" rx="2" fill="#245C48" stroke="none"/><rect x="140.0" y="136" width="116.0" height="4" rx="2" fill="#DCE3DC" stroke="none"/><rect x="260.0" y="136" width="116.0" height="4" rx="2" fill="#DCE3DC" stroke="none"/><defs><clipPath id="onboard1-clip"><rect x="0" y="164" width="400" height="628.5"/></clipPath></defs><g clip-path="url(#onboard1-clip)"><g transform="translate(0 164)"><circle cx="200.0" cy="105" r="96" fill="#E4EDE3" stroke="#DCE3DC" stroke-width="1"/><circle cx="200.0" cy="105" r="73" fill="none" stroke="#DCE3DC" stroke-width="1"/><circle cx="200.0" cy="105" r="50" fill="none" stroke="#DCE3DC" stroke-width="1"/><rect x="171.0" y="63" width="58" height="84" rx="14" fill="#FFFFFF" stroke="#245C48"/><g transform="translate(182.0 85) scale(1.5)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V4h4 M16 4h4v4 M20 16v4h-4 M8 20H4v-4 M9 8v8 M13 6q7 6 0 12"/></g><text x="20" y="248" font-size="24" font-weight="600" text-anchor="start" fill="#192D28">A small tap. A fresh start.</text><text x="20" y="274" font-size="14" font-weight="400" text-anchor="start" fill="#596A63">Pair a tag, place it where you focus, and tap</text><text x="20" y="295" font-size="14" font-weight="400" text-anchor="start" fill="#596A63">your phone to begin.</text><text x="20" y="322" font-size="13" font-weight="600" text-anchor="start" fill="#596A63">FIRST MODE</text><rect x="20" y="336" width="360" height="54" rx="12" fill="#FFFFFF" stroke="#DCE3DC"/><text x="36" y="370" font-size="16" font-weight="400" text-anchor="start" fill="#192D28">Deep Work</text><text x="20" y="420" font-size="14" font-weight="400" text-anchor="start" fill="#596A63">No tag yet? You can start from the app.</text><rect x="20.0" y="434" width="360.0" height="48" rx="14" fill="#FFFFFF" stroke="#DCE3DC"/><text x="200.0" y="464" font-size="14" font-weight="600" text-anchor="middle" fill="#596A63">Set up later</text></g></g><rect x="0" y="792.5" width="400" height="100.0" rx="0" fill="#F5F4EE" stroke="none"/><rect x="20" y="802.5" width="360" height="54" rx="17" fill="#245C48" stroke="none"/><text x="200.0" y="836.5" font-size="16" font-weight="650" text-anchor="middle" fill="#FFFFFF">Scan NFC tag</text><rect x="147.0" y="879.5" width="106" height="4" rx="2" fill="#192D28" stroke="none"/></g></g></svg>
