<svg xmlns="http://www.w3.org/2000/svg" width="440" height="956" viewBox="0 0 440 956" role="img" aria-labelledby="title desc"><title id="title">01 · Form / start</title><desc id="desc">One scrolling form · stable Save action · beginning and end shown; static vector design proposal.</desc><g font-family="Arial, Helvetica, sans-serif"><defs><clipPath id="phone-outline"><rect width="440" height="956" rx="30"/></clipPath></defs><g clip-path="url(#phone-outline)"><rect x="0" y="0" width="440" height="956" rx="30" fill="#F5F4EE" stroke="none"/><text x="25" y="29" font-size="13" font-weight="600" text-anchor="start" fill="#192D28">9:41</text><circle cx="220.0" cy="23" r="5" fill="#17211D" stroke="none" stroke-width="1"/><rect x="358" y="26" width="3" height="4" rx="1" fill="#192D28" stroke="none"/><rect x="363" y="23" width="3" height="7" rx="1" fill="#192D28" stroke="none"/><rect x="368" y="20" width="3" height="10" rx="1" fill="#192D28" stroke="none"/><rect x="373" y="17" width="3" height="13" rx="1" fill="#192D28" stroke="none"/><rect x="389" y="17" width="25" height="12" rx="3" fill="none" stroke="#192D28"/><rect x="392" y="20" width="18" height="6" rx="1" fill="#192D28" stroke="none"/><rect x="416" y="21" width="2" height="4" rx="1" fill="#192D28" stroke="none"/><g transform="translate(20 63) scale(1.0)" fill="none" stroke="#192D28" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4l-8 8 8 8"/></g><text x="56" y="87" font-size="28" font-weight="650" text-anchor="start" fill="#192D28">Edit mode</text><text x="20" y="116" font-size="14" font-weight="400" text-anchor="start" fill="#596A63">Deep Work · Changes apply next session</text><defs><clipPath id="editor-top-clip"><rect x="0" y="146" width="440" height="710"/></clipPath></defs><g clip-path="url(#editor-top-clip)"><g transform="translate(0 146)"><text x="20" y="13" font-size="13" font-weight="600" text-anchor="start" fill="#596A63">MODE NAME</text><rect x="20" y="27" width="400" height="54" rx="12" fill="#FFFFFF" stroke="#DCE3DC"/><text x="36" y="61" font-size="16" font-weight="400" text-anchor="start" fill="#192D28">Deep Work</text><text x="20" y="122" font-size="13" font-weight="650" text-anchor="start" fill="#596A63">DAILY GOAL</text><rect x="20.0" y="141" width="128.0" height="48" rx="14" fill="#FFFFFF" stroke="#DCE3DC"/><text x="84.0" y="171" font-size="14" font-weight="600" text-anchor="middle" fill="#596A63">30 min</text><rect x="156.0" y="141" width="128.0" height="48" rx="14" fill="#FFFFFF" stroke="#DCE3DC"/><text x="220.0" y="171" font-size="14" font-weight="600" text-anchor="middle" fill="#596A63">1 hour</text><rect x="292.0" y="141" width="128.0" height="48" rx="14" fill="#245C48" stroke="#DCE3DC"/><text x="356.0" y="171" font-size="14" font-weight="600" text-anchor="middle" fill="#FFFFFF">2 hours</text><rect x="20" y="203" width="400" height="76" rx="18" fill="#FFFFFF" stroke="#DCE3DC"/><rect x="34" y="221" width="36" height="36" rx="12" fill="#E4EDE3" stroke="none"/><g transform="translate(41 228) scale(0.9166666666666666)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11a9 9 0 1 1 2 7 M3 4v7h7 M12 7v6l4 2"/></g><text x="82" y="233" font-size="16" font-weight="600" text-anchor="start" fill="#192D28">Custom goal</text><text x="82" y="255" font-size="13" font-weight="400" text-anchor="start" fill="#596A63">Choose hours and minutes</text><g transform="translate(383 229) scale(0.8333333333333334)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4l8 8-8 8"/></g><text x="20" y="314" font-size="13" font-weight="650" text-anchor="start" fill="#596A63">APPS</text><rect x="20.0" y="333" width="196.0" height="48" rx="14" fill="#245C48" stroke="#DCE3DC"/><text x="118.0" y="363" font-size="14" font-weight="600" text-anchor="middle" fill="#FFFFFF">Block selected</text><rect x="224.0" y="333" width="196.0" height="48" rx="14" fill="#FFFFFF" stroke="#DCE3DC"/><text x="322.0" y="363" font-size="14" font-weight="600" text-anchor="middle" fill="#596A63">Allow selected</text><rect x="20" y="395" width="400" height="76" rx="18" fill="#FFFFFF" stroke="#DCE3DC"/><rect x="34" y="413" width="36" height="36" rx="12" fill="#E4EDE3" stroke="none"/><g transform="translate(41 420) scale(0.9166666666666666)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2h10v20H7Z M10 18h4"/></g><text x="82" y="425" font-size="16" font-weight="600" text-anchor="start" fill="#192D28">Selected apps</text><text x="82" y="447" font-size="13" font-weight="400" text-anchor="start" fill="#596A63">Instagram, YouTube, Reddit</text><g transform="translate(383 421) scale(0.8333333333333334)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4l8 8-8 8"/></g><text x="20" y="495" font-size="14" font-weight="400" text-anchor="start" fill="#596A63">Only these 3 apps are blocked. Everything else stays</text><text x="20" y="516" font-size="14" font-weight="400" text-anchor="start" fill="#596A63">available.</text><text x="20" y="555" font-size="13" font-weight="650" text-anchor="start" fill="#596A63">SESSION RULES</text><rect x="20" y="574" width="400" height="88" rx="18" fill="#FFFFFF" stroke="#DCE3DC"/><rect x="34" y="592" width="36" height="36" rx="12" fill="#E4EDE3" stroke="none"/><g transform="translate(41 599) scale(0.9166666666666666)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10h12v11H6Z M8 10V7a4 4 0 0 1 8 0v3"/></g><text x="82" y="604" font-size="16" font-weight="600" text-anchor="start" fill="#192D28">Strict mode</text><text x="82" y="626" font-size="13" font-weight="400" text-anchor="start" fill="#596A63">End with the starting tag. Emergency hold</text><text x="82" y="645" font-size="13" font-weight="400" text-anchor="start" fill="#596A63">stays available.</text><rect x="371" y="597" width="35" height="22" rx="11" fill="#245C48" stroke="none"/><circle cx="394" cy="608" r="8" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="20" y="697" font-size="13" font-weight="650" text-anchor="start" fill="#596A63">SOUND</text><rect x="20.0" y="716" width="128.0" height="48" rx="14" fill="#FFFFFF" stroke="#DCE3DC"/><text x="84.0" y="746" font-size="14" font-weight="600" text-anchor="middle" fill="#596A63">Unchanged</text><rect x="156.0" y="716" width="128.0" height="48" rx="14" fill="#245C48" stroke="#DCE3DC"/><text x="220.0" y="746" font-size="14" font-weight="600" text-anchor="middle" fill="#FFFFFF">Silent</text><rect x="292.0" y="716" width="128.0" height="48" rx="14" fill="#FFFFFF" stroke="#DCE3DC"/><text x="356.0" y="746" font-size="14" font-weight="600" text-anchor="middle" fill="#596A63">DND</text><text x="20" y="792" font-size="14" font-weight="400" text-anchor="start" fill="#596A63">Your original sound settings return when the session</text><text x="20" y="813" font-size="14" font-weight="400" text-anchor="start" fill="#596A63">ends.</text><text x="20" y="852" font-size="13" font-weight="650" text-anchor="start" fill="#596A63">ADVANCED</text><rect x="20" y="871" width="400" height="76" rx="18" fill="#FFFFFF" stroke="#DCE3DC"/><rect x="34" y="889" width="36" height="36" rx="12" fill="#E4EDE3" stroke="none"/><g transform="translate(41 896) scale(0.9166666666666666)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11a9 9 0 1 1 2 7 M3 4v7h7 M12 7v6l4 2"/></g><text x="82" y="901" font-size="16" font-weight="600" text-anchor="start" fill="#192D28">Auto-end timer</text><text x="82" y="923" font-size="13" font-weight="400" text-anchor="start" fill="#596A63">Off · Choose 5–720 minutes</text><g transform="translate(383 897) scale(0.8333333333333334)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4l8 8