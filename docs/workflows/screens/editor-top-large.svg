ke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h8l10 10-8 8L3 11Z M7 7h.01"/></g><text x="82" y="1203" font-size="16" font-weight="600" text-anchor="start" fill="#192D28">Desk</text><text x="82" y="1225" font-size="13" font-weight="400" text-anchor="start" fill="#596A63">Paired with Deep Work</text><g transform="translate(383 1199) scale(0.8333333333333334)" fill="none" stroke="#245C48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 6"/></g><text x="20" y="1273" font-size="14" font-weight="400" text-anchor="start" fill="#596A63">Tag assignments update when you save.</text><rect x="20" y="1287" width="400" height="68" rx="16" fill="#E4EDE3" stroke="none"/><text x="36" y="1315" font-size="15" font-weight="650" text-anchor="start" fill="#245C48">Ready to save</text><text x="36" y="1338" font-size="13" font-weight="400" text-anchor="start" fill="#596A63">3 apps blocked · 2h goal · Silent · Strict</text></g></g><rect x="433" y="154" width="3" height="690" rx="2" fill="#DCE3DC" stroke="none"/><rect x="433" y="154.0" width="3" height="58" rx="2" fill="#596A63" stroke="none"/><rect x="0" y="856" width="440" height="100" rx="0" fill="#F5F4EE" stroke="none"/><rect x="20" y="866" width="400" height="54" rx="17" fill="#245C48" stroke="none"/><text x="220.0" y="900" font-size="16" font-weight="650" text-anchor="middle" fill="#FFFFFF">Save changes</text><rect x="167.0" y="943" width="106" height="4" rx="2" fill="#192D28" stroke="none"/></g></g></svg>
